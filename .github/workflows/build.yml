name: Build CryptoAnalyser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            while IFS= read -r file; do
              candidate="$(dirname "$file")"

              if [ -f "$candidate/gradlew" ]; then
                PROJECT_DIR="$candidate"
                break
              fi

              if [ -f "$candidate/settings.gradle.kts" ] || \
                 [ -f "$candidate/settings.gradle" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find . -type f \
                \( -name "settings.gradle.kts" \
                -o -name "settings.gradle" \) \
                -not -path "*/.gradle/*" \
                -not -path "*/build/*" \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project directory not found."
            echo "Expected gradlew or settings.gradle(.kts)."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -e
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          APK_PATH="$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -not -name "*androidTest*" \
            | head -1)"

          if [ -z "$APK_PATH" ]; then
            echo "Debug APK not found."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
