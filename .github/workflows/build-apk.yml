
name: Build CryptoAnalyser Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          set +e
          yes | sdkmanager --licenses
          sdk_status=${PIPESTATUS[1]}
          set -e

          if [ "$sdk_status" -ne 0 ]; then
            echo "ERROR: Android SDK license acceptance failed."
            exit "$sdk_status"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate or safely extract Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          excluded = {
              ".git", ".gradle", ".idea",
              "build", "node_modules"
          }
          max_depth = 8

          def is_android_root(path):
              has_settings = (
                  (path / "settings.gradle").is_file()
                  or (path / "settings.gradle.kts").is_file()
              )
              has_app = (
                  (path / "app" / "build.gradle").is_file()
                  or (path / "app" / "build.gradle.kts").is_file()
              )
              return has_settings and has_app

          def find_roots(base):
              found = []

              for current, dirs, files in os.walk(base):
                  path = Path(current)

                  try:
                      depth = len(path.relative_to(base).parts)
                  except ValueError:
                      dirs[:] = []
                      continue

                  dirs[:] = [
                      d for d in dirs
                      if d not in excluded and depth < max_depth
                  ]

                  if is_android_root(path):
                      found.append(path)
                      dirs[:] = []

              return found

          roots = find_roots(workspace)

          if not roots:
              extraction_base = workspace / ".android-extracted"
              extraction_base.mkdir(exist_ok=True)

              archives = []
              for current, dirs, files in os.walk(workspace):
                  dirs[:] = [
                      d for d in dirs
                      if d not in excluded
                      and d != ".android-extracted"
                  ]

                  for name in files:
                      if name.lower().endswith(".zip"):
                          archives.append(Path(current) / name)

              for index, archive in enumerate(archives):
                  destination = extraction_base / f"archive_{index}"
                  destination.mkdir(parents=True, exist_ok=True)

                  try:
                      with zipfile.ZipFile(archive) as zf:
                          members = zf.infolist()

                          if sum(m.file_size for m in members) > 500 * 1024 * 1024:
                              print(f"Skipping oversized ZIP: {archive}")
                              continue

                          for member in members:
                              target = (
                                  destination / member.filename
                              ).resolve()

                              if (
                                  target != destination.resolve()
                                  and destination.resolve() not in target.parents
                              ):
                                  raise ValueError(
                                      "Unsafe ZIP entry: "
                                      + member.filename
                                  )

                          zf.extractall(destination)

                      roots = find_roots(destination)

                      if roots:
                          break

                  except (OSError, ValueError, zipfile.BadZipFile) as error:
                      print(f"Could not extract {archive}: {error}")

          if not roots:
              print("Top-level repository contents:")
              for item in sorted(workspace.iterdir()):
                  print(" -", item.name)

              raise SystemExit(
                  "ERROR: Android project not found. "
                  "Expected settings.gradle(.kts) and "
                  "app/build.gradle(.kts), directly or inside a ZIP."
              )

          roots = sorted(
              set(roots),
              key=lambda p: (len(p.parts), str(p))
          )

          project = roots[0].resolve()
          print(f"Selected Android project: {project}")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              f.write(f"project_dir={project}\n")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory: $PWD"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify generated APK
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "Expected APK not found or empty:"
            echo "$APK"

            echo "Searching for generated APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true

            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-debug-apk
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
