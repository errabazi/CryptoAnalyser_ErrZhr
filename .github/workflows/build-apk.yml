
name: Build CryptoAnalyser Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate or safely extract Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          excluded = {".git", ".gradle", "build", ".idea", "node_modules"}
          max_depth = 7

          def is_android_root(path):
              settings = (
                  (path / "settings.gradle").is_file()
                  or (path / "settings.gradle.kts").is_file()
              )
              app_gradle = (
                  (path / "app" / "build.gradle").is_file()
                  or (path / "app" / "build.gradle.kts").is_file()
              )
              return settings and app_gradle

          def find_roots(base):
              found = []
              for current, dirs, files in os.walk(base):
                  current_path = Path(current)

                  try:
                      depth = len(current_path.relative_to(base).parts)
                  except ValueError:
                      dirs[:] = []
                      continue

                  dirs[:] = [
                      d for d in dirs
                      if d not in excluded
                      and not d.startswith(".")
                      and depth < max_depth
                  ]

                  if is_android_root(current_path):
                      found.append(current_path)

                      # Do not descend into a discovered project.
                      dirs[:] = []

              return found

          roots = find_roots(workspace)

          if not roots:
              archives = []
              for current, dirs, files in os.walk(workspace):
                  dirs[:] = [
                      d for d in dirs
                      if d not in excluded
                      and not d.startswith(".")
                  ]
                  for filename in files:
                      if filename.lower().endswith(".zip"):
                          archives.append(Path(current) / filename)

              extraction_base = workspace / ".android-project-extracted"
              extraction_base.mkdir(exist_ok=True)

              for index, archive in enumerate(archives):
                  destination = extraction_base / f"archive_{index}"
                  destination.mkdir(parents=True, exist_ok=True)

                  try:
                      with zipfile.ZipFile(archive) as zf:
                          members = zf.infolist()

                          # Reject suspiciously large archives.
                          total_size = sum(item.file_size for item in members)
                          if total_size > 500 * 1024 * 1024:
                              print(f"Skipping oversized ZIP: {archive}")
                              continue

                          # Prevent path traversal during extraction.
                          for item in members:
                              target = (destination / item.filename).resolve()
                              if target != destination.resolve() and destination.resolve() not in target.parents:
                                  raise ValueError("Unsafe ZIP entry path")

                          zf.extractall(destination)

                      roots.extend(find_roots(destination))

                      if roots:
                          break

                  except (zipfile.BadZipFile, OSError, ValueError) as error:
                      print(f"Could not extract {archive}: {error}")

          # Prefer the shallowest valid Android project root.
          roots = sorted(set(roots), key=lambda p: (len(p.parts), str(p)))

          if not roots:
              print("Repository contents:")
              for item in sorted(workspace.iterdir()):
                  print(" -", item.name)

              raise SystemExit(
                  "ERROR: No Android project found. "
                  "Expected settings.gradle(.kts) and "
                  "app/build.gradle(.kts), possibly inside a ZIP."
              )

          project = roots[0]
          print(f"Android project root: {project}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"project_dir={project}\n")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building project in: $PWD"

          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK
        id: verify
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "ERROR: APK was not generated at:"
            echo "$APK"
            echo "Searching for APK files..."
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-debug-apk
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-build-diagnostics
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
