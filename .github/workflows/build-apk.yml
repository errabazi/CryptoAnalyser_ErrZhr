
name: Build CryptoAnalyser Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory was not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          ls -la "$SDK_ROOT/cmdline-tools" || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager || true
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS="${PIPESTATUS[1]}"
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "ERROR: Could not accept Android SDK licenses."
            exit "$SDK_STATUS"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Locate Android project or extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import zipfile
          from pathlib import Path

          repo = Path.cwd().resolve()
          temp = Path(os.environ["RUNNER_TEMP"]) / "cryptoanalyser-project"
          temp.mkdir(parents=True, exist_ok=True)

          excluded = {
              ".git", ".gradle", ".idea", "build",
              "node_modules", ".github"
          }

          def is_gradle_file(directory, base):
              return (
                  (directory / f"{base}.gradle").is_file()
                  or (directory / f"{base}.gradle.kts").is_file()
              )

          def find_projects(base):
              found = []

              for root, dirs, files in os.walk(base):
                  dirs[:] = [
                      d for d in dirs
                      if d not in excluded
                  ]

                  directory = Path(root)

                  has_settings = (
                      (directory / "settings.gradle").is_file()
                      or (directory / "settings.gradle.kts").is_file()
                  )

                  has_app = (
                      is_gradle_file(directory / "app", "build")
                  )

                  if has_settings and has_app:
                      found.append(directory)

              return sorted(
                  found,
                  key=lambda p: (len(p.parts), str(p))
              )

          projects = find_projects(repo)

          if projects:
              project = projects[0]
              print(f"Found Android project: {project}")
          else:
              archives = sorted(
                  p for p in repo.rglob("*.zip")
                  if ".git" not in p.parts
              )

              project = None

              for archive in archives:
                  destination = temp / archive.stem
                  destination.mkdir(parents=True, exist_ok=True)

                  try:
                      with zipfile.ZipFile(archive) as zf:
                          for member in zf.infolist():
                              target = (destination / member.filename).resolve()

                              if not target.is_relative_to(destination.resolve()):
                                  raise ValueError(
                                      f"Unsafe ZIP entry: {member.filename}"
                                  )

                          zf.extractall(destination)

                  except Exception as exc:
                      print(f"Skipping {archive.name}: {exc}")
                      continue

                  extracted_projects = find_projects(destination)

                  if extracted_projects:
                      project = extracted_projects[0]
                      print(f"Found Android project in {archive.name}")
                      break

              if project is None:
                  raise SystemExit(
                      "ERROR: No Android project found. "
                      "Expected settings.gradle(.kts) and app/build.gradle(.kts), "
                      "either in the repository or inside a ZIP archive."
                  )

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROJECT_DIR={project}\n")

          print(f"Project root: {project}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory: $PROJECT_DIR"
          echo "Java version:"
          java -version

          echo "Gradle files:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon assembleDebug
          else
            echo "ERROR: Neither gradlew nor Gradle is available."
            exit 1
          fi

          echo "Searching for generated APK..."

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -size +0c \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished without producing a non-empty APK."
            find "$PROJECT_DIR" -type f \
              \( -name "*.apk" -o -name "*.log" \) -print || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK generated successfully: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAnalyser-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Show build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "Android build failed."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Java version:"
          java -version || true
          echo "Android SDK:"
          echo "${ANDROID_HOME:-not set}"
          echo "Project directory:"
          echo "${PROJECT_DIR:-not detected}"

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            find "$PROJECT_DIR" -maxdepth 5 \
              \( -name "*.apk" -o -name "*.log" \) \
              -type f -print || true
          fi
